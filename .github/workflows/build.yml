name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o Cinesuivi.zip
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Create dummy google-services.json
        run: |
          mkdir -p Cinesuivi/app
          cat > Cinesuivi/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "cinesuivi-dummy",
              "storage_bucket": "cinesuivi-dummy.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:abc123",
                "android_client_info": { "package_name": "com.cinesuivi" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyDummyKey" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
          cat Cinesuivi/app/google-services.json
      - name: Build APK
        working-directory: Cinesuivi
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinesuivi-APK
          path: Cinesuivi/app/build/outputs/apk/debug/*.apk
