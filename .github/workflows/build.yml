name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o Cinesuivi.zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create google-services.json
        run: |
          PKG=$(grep -rho "applicationId.*" Cinesuivi --include="*.gradle" | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$PKG" ]; then PKG=$(grep -rho "namespace.*" Cinesuivi --include="*.gradle" | head -1 | grep -oE "'[^']+'" | tr -d "'"); fi
          if [ -z "$PKG" ]; then PKG="com.cinesuivi"; fi
          echo "Package: $PKG"
          echo "{\"project_info\":{\"project_number\":\"1234567890\",\"project_id\":\"cinesuivi-dummy\",\"storage_bucket\":\"dummy.appspot.com\"},\"client\":[{\"client_info\":{\"mobilesdk_app_id\":\"1:123:android:abc\",\"android_client_info\":{\"package_name\":\"$PKG\"}},\"oauth_client\":[],\"api_key\":[{\"current_key\":\"AIzaSyDummy\"}],\"services\":{}}],\"configuration_version\":\"1\"}" > Cinesuivi/app/google-services.json

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        working-directory: Cinesuivi
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Cinesuivi-APK
          path: Cinesuivi/app/build/outputs/apk/debug/*.apk
